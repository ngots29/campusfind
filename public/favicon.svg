* {
  box-sizing: border-box;
}

:root {
  --navy: #173b63;
  --royal: #3478c9;
  --teal: #20b8a6;
  --bg: #f5f7fb;
  --card: #ffffff;
  --muted: #6b7280;
  --border: #e5e7eb;
  --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  --danger: #d64545;
  --warning: #d97706;
  --success: #15803d;
}

html, body, #root {
  margin: 0;
  min-height: 100%;
  font-family: Inter, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: #111827;
}

body {
  min-height: 100vh;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app-shell {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 260px;
  background: white;
  border-right: 1px solid var(--border);
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 28px;
}

.logo {
  width: 50px;
  height: 50px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--navy), var(--royal));
  color: white;
  display: grid;
  place-items: center;
  font-size: 1.4rem;
}

.brand-wrap h2 {
  margin: 0;
  font-size: 1.2rem;
}

.brand-wrap small {
  color: var(--muted);
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #334155;
  padding: 10px 12px;
  border-radius: 12px;
  transition: 0.2s ease;
  position: relative;
}

.nav-item:hover,
.nav-item.active {
  background: rgba(23, 59, 99, 0.08);
  color: var(--navy);
}

.nav-item .badge {
  margin-left: auto;
  background: var(--danger);
  color: white;
  border-radius: 999px;
  padding: 2px 7px;
  font-size: 0.7rem;
}

.profile-box {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 10px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--bg);
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--navy), var(--teal));
  color: white;
  display: grid;
  place-items: center;
  font-weight: 700;
}

.avatar.large {
  width: 64px;
  height: 64px;
  font-size: 1.3rem;
}

.main-content {
  flex: 1;
  padding: 24px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.topbar h1 {
  margin: 0;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--royal);
  font-weight: 700;
  font-size: 0.72rem;
}

.eyebrow.accent {
  color: var(--teal);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.content-wrap {
  max-width: 1200px;
}

.page-block {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
}

.stat-card {
  border-radius: 16px;
  padding: 18px;
  background: white;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.stat-card span {
  color: var(--muted);
  display: block;
  margin-bottom: 8px;
}

.stat-card strong {
  font-size: 2rem;
  color: var(--navy);
}

.stat-card.navy { border-left: 4px solid var(--navy); }
.stat-card.blue { border-left: 4px solid var(--royal); }
.stat-card.teal { border-left: 4px solid var(--teal); }
.stat-card.orange { border-left: 4px solid var(--warning); }
.stat-card.green { border-left: 4px solid var(--success); }
.stat-card.red { border-left: 4px solid var(--danger); }

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  box-shadow: var(--shadow);
}

.card.wide {
  max-width: 760px;
}

.list-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.list-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.list-row:last-child {
  border-bottom: none;
}

.list-row strong,
.meta strong {
  display: block;
  margin-bottom: 2px;
}

.list-row small,
.meta small,
.card p,
.card li,
.card small {
  color: var(--muted);
}

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(23, 59, 99, 0.08);
  color: var(--navy);
  font-size: 0.75rem;
  font-weight: 700;
}

.pill.status {
  background: rgba(32, 184, 166, 0.12);
  color: var(--teal);
}

.button {
  border: none;
  background: linear-gradient(135deg, var(--navy), var(--royal));
  color: white;
  border-radius: 10px;
  padding: 10px 16px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.button.secondary {
  background: #edf3ff;
  color: var(--navy);
}

.button.small {
  padding: 8px 12px;
  font-size: 0.8rem;
}

.button.danger {
  background: var(--danger);
}

.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 12px;
  background: white;
}

.chip.secondary {
  background: #eff6ff;
}

.hero-page {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.hero {
  display: grid;
  grid-template-columns: 1.3fr 0.7fr;
  gap: 20px;
  align-items: center;
  padding: 32px;
}

.hero h1 {
  font-size: clamp(2rem, 4vw, 3rem);
  margin-top: 10px;
  margin-bottom: 14px;
}

.hero p {
  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1.7;
}

.cta-group {
  display: flex;
  gap: 12px;
  margin-top: 18px;
  flex-wrap: wrap;
}

.hero-graphic {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.mini-card {
  background: linear-gradient(135deg, #ecf5ff, #f4fbf9);
  border-radius: 18px;
  padding: 18px;
  border: 1px solid var(--border);
}

.mini-card.alt {
  background: linear-gradient(135deg, #f5fbff, #ebfff9);
}

.mini-card strong {
  display: block;
  font-size: 2rem;
  color: var(--navy);
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.auth-wrap {
  min-height: 75vh;
  display: grid;
  place-items: center;
}

.auth-card {
  width: min(720px, 100%);
}

.stack-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.grid-two {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

label {
  display: flex;
  flex-direction: column;
  gap: 8px;
  color: #1f2937;
  font-weight: 600;
}

input, textarea, select {
  border: 1px solid var(--border);
  background: #f9fafb;
  padding: 12px 14px;
  border-radius: 10px;
  color: #111827;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.full-width {
  grid-column: 1 / -1;
}

.checkbox {
  flex-direction: row !important;
  align-items: center;
  gap: 10px;
}

.alert {
  border-radius: 10px;
  padding: 12px 14px;
  font-weight: 600;
}

.alert.error {
  background: rgba(214, 69, 69, 0.08);
  color: var(--danger);
}

.alert.success {
  background: rgba(21, 128, 61, 0.08);
  color: var(--success);
}

.inline-actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  color: var(--royal);
}

.empty-state {
  text-align: center;
  padding: 32px 20px;
}

.listing-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.thumb {
  background: linear-gradient(135deg, #eef2ff, #ecfeff);
  height: 180px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 2.5rem;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 12px;
}

.meta {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.span-full {
  grid-column: 1 / -1;
}

.match-card,
.detail-card,
.claim-box,
.notifications-box,
.profile-card,
.chart-card {
  width: 100%;
}

.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.detail-body {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 18px;
  margin-top: 16px;
}

.cover-box {
  min-height: 220px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #ecf5ff, #ebfef9);
  font-size: 3rem;
}

.detail-info {
  display: grid;
  gap: 10px;
}

.claim-review,
.notification,
.conversation {
  width: 100%;
}

.notifications-box,
.messages-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 18px;
}

.conversation {
  border: 1px solid var(--border);
  background: #f8fafc;
  border-radius: 10px;
  padding: 12px;
  text-align: left;
}

.conversation.active {
  background: rgba(52, 120, 201, 0.08);
  border-color: rgba(52, 120, 201, 0.2);
}

.message-stream {
  min-height: 240px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.message {
  max-width: 80%;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

.message.outgoing {
  background: var(--navy);
  color: white;
  margin-left: auto;
}

.message.incoming {
  background: #f3f4f6;
  margin-right: auto;
}

.composer {
  display: flex;
  gap: 12px;
}

.composer input {
  flex: 1;
}

.notification.unread {
  border-left: 4px solid var(--teal);
}

.notification.read {
  opacity: 0.75;
}

.chart-card {
  padding: 20px;
}

.bars {
  height: 200px;
  display: flex;
  align-items: end;
  gap: 14px;
}

.bars span {
  flex: 1;
  background: linear-gradient(180deg, var(--royal), var(--teal));
  border-radius: 12px 12px 0 0;
}

.legal-page {
  max-width: 820px;
}

.toaster {
  position: fixed;
  right: 20px;
  bottom: 20px;
}

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: var(--navy);
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  box-shadow: var(--shadow);
}

@media (max-width: 900px) {
  .sidebar {
    display: none;
  }

  .main-content {
    padding: 16px;
  }

  .hero,
  .detail-body,
  .messages-layout,
  .notifications-box,
  .grid-two {
    grid-template-columns: 1fr;
  }
}
